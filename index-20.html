<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111110;
    --frame:rgba(255,255,255,0.09);
    --panel:rgba(20,20,19,0.55);
    --ink:#f4f3f0;
    --ink-dim:#8f8d88;
    --pink-1:#f6a8c7;
    --pink-2:#e2618f;
    --gold:#ffd36e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; width:100%;
    background:var(--bg);
    font-family:'Sora', sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    height:100dvh; width:100vw;
    display:flex; align-items:center; justify-content:center;
  }

  .frame{
    position:relative;
    width:min(92vw, 1100px);
    aspect-ratio:16/10;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--frame);
    box-shadow:0 30px 70px -30px rgba(0,0,0,0.7);
    background:#0a0a0a;
  }

  #outputCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    transform:scaleX(-1);
    display:block;
  }

  #video{ position:absolute; left:-99999px; top:0; }

  .chrome{
    position:absolute; inset:0;
    z-index:5;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:18px;
  }

  .mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.01em;
    color:var(--ink);
    opacity:0.9;
    pointer-events:none;
  }

  .hint{
    align-self:flex-start;
    max-width:280px;
    font-size:12.5px;
    line-height:1.5;
    color:var(--ink-dim);
    background:var(--panel);
    backdrop-filter:blur(8px);
    border:1px solid var(--frame);
    border-radius:8px;
    padding:9px 12px;
    opacity:1;
    transition:opacity 0.8s ease;
    pointer-events:none;
  }
  .hint.gone{ opacity:0; }

  .controls{
    display:flex;
    justify-content:flex-end;
    pointer-events:none;
  }

  button{
    font-family:'Sora', sans-serif;
    font-size:12px;
    font-weight:500;
    border-radius:100px;
    border:1px solid var(--frame);
    background:var(--panel);
    color:var(--ink-dim);
    padding:8px 16px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    transition:background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    pointer-events:auto;
  }
  button:hover{ background:rgba(255,255,255,0.08); color:var(--ink); }
  button:active{ transform:scale(0.96); }
  button.primary{
    background:linear-gradient(135deg, var(--pink-2), var(--pink-1));
    color:#2c0c1a;
    border:none;
    font-weight:600;
    padding:11px 22px;
    font-size:13px;
  }
  button.primary:hover{ filter:brightness(1.07); }

  .center-overlay{
    position:absolute; inset:0;
    z-index:10;
    display:flex;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:14px;
    text-align:center;
    padding:40px;
    background:rgba(10,10,10,0.92);
    transition:opacity 0.5s ease;
  }
  .center-overlay.hidden{ opacity:0; pointer-events:none; }

  .bud{
    width:30px; height:30px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--pink-1), var(--gold), var(--pink-1));
    -webkit-mask:radial-gradient(circle, transparent 55%, black 56%);
    mask:radial-gradient(circle, transparent 55%, black 56%);
    animation:spin 1.4s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .center-overlay h2{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
  }
  .center-overlay p{
    margin:0;
    max-width:320px;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .bud{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <video id="video" playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <div class="chrome">
      <div class="mark">Bloom</div>
      <div class="controls">
        <button id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="hint" id="hint" style="position:absolute; left:18px; bottom:18px;">
      Show your hand — pinch to leave a flower behind.
    </div>

    <div class="center-overlay" id="startOverlay">
      <h2>Let the garden see you</h2>
      <p>This needs your camera to find your fingertip. Nothing is recorded or sent anywhere.</p>
      <button class="primary" id="startBtn">Enable camera</button>
    </div>

    <div class="center-overlay hidden" id="loadingOverlay">
      <div class="bud"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const hint = document.getElementById('hint');
  const clearBtn = document.getElementById('clearBtn');

  const W = 1280, H = 800;
  canvas.width = W; canvas.height = H;

  // ---------- Flower drawing ----------
  function drawFlower(x, y, size, rotation, hueShift, alpha){
    if(size <= 0.5 || alpha <= 0.01) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = alpha;

    const petalCount = 11;
    for(let i=0;i<petalCount;i++){
      const a = (Math.PI*2/petalCount)*i;
      ctx.save();
      ctx.rotate(a);
      const petalLen = size;
      const petalWidth = size*0.34;
      const grad = ctx.createLinearGradient(0,0,0,-petalLen);
      grad.addColorStop(0, `hsl(${338+hueShift}, 70%, 78%)`);
      grad.addColorStop(1, `hsl(${330+hueShift}, 80%, 68%)`);
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(230,90,140,0.3)';
      ctx.shadowBlur = size*0.22;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(petalWidth, -petalLen*0.55, 0, -petalLen);
      ctx.quadraticCurveTo(-petalWidth, -petalLen*0.55, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    ctx.shadowBlur = 0;
    const centerGrad = ctx.createRadialGradient(0,0,0,0,0,size*0.3);
    centerGrad.addColorStop(0, '#fff2c4');
    centerGrad.addColorStop(1, '#ffb84d');
    ctx.fillStyle = centerGrad;
    ctx.beginPath();
    ctx.arc(0,0,size*0.24,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawCluster(x, y, baseSize, t, alpha){
    drawFlower(x - baseSize*0.7, y - baseSize*0.35, baseSize*0.42, Math.sin(t*1.3)*0.15 - 0.4, 14, alpha*0.95);
    drawFlower(x + baseSize*0.68, y - baseSize*0.2, baseSize*0.36, Math.sin(t*1.1+1)*0.15 + 0.5, -10, alpha*0.95);
    drawFlower(x, y, baseSize, Math.sin(t)*0.08, 0, alpha);
  }

  // easing for a soft bloom-in
  function easeOutBack(t){
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ---------- State (raw, updated by MediaPipe) ----------
  let rawTargetX = W/2, rawTargetY = H/2;
  let handPresent = false;
  let wasPinching = false;
  let everDetected = false;
  let stickers = []; // {x,y,size,rot,hue,bornAt}
  const MAX_STICKERS = 14;

  // ---------- State (smoothed, updated every animation frame) ----------
  let smoothX = W/2, smoothY = H/2;
  let liveScale = 0;
  let targetScale = 0;
  let clock = 0;
  let lastFrameTime = performance.now();

  clearBtn.addEventListener('click', () => { stickers = []; });

  // ---------- MediaPipe setup ----------
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });
  hands.onResults(onResults);

  function onResults(results){
    const lm = results.multiHandLandmarks && results.multiHandLandmarks[0];

    if(lm){
      if(!handPresent && !everDetected){
        everDetected = true;
        hint.classList.add('gone');
      }
      handPresent = true;
      targetScale = 1;

      const idx = lm[8];
      const thumb = lm[4];

      rawTargetX = idx.x * W;
      rawTargetY = idx.y * H;

      const dx = idx.x - thumb.x, dy = idx.y - thumb.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const isPinching = dist < 0.045;

      if(isPinching && !wasPinching){
        const midX = (idx.x + thumb.x)/2 * W;
        const midY = (idx.y + thumb.y)/2 * H;
        stickers.push({
          x: midX, y: midY,
          size: 44 + Math.random()*20,
          rot: Math.random()*Math.PI*2,
          hue: -20 + Math.random()*40,
          bornAt: clock
        });
        if(stickers.length > MAX_STICKERS) stickers.shift();
      }
      wasPinching = isPinching;
    } else {
      handPresent = false;
      wasPinching = false;
      targetScale = 0;
    }
  }

  // ---------- Render loop: decoupled from model inference for buttery smoothness ----------
  function render(now){
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    clock += dt;

    // frame-rate independent exponential smoothing
    const posLerp = 1 - Math.pow(0.0015, dt);   // fast, fluid follow
    const scaleLerp = 1 - Math.pow(0.02, dt);   // gentle grow/shrink

    smoothX += (rawTargetX - smoothX) * posLerp;
    smoothY += (rawTargetY - smoothY) * posLerp;
    liveScale += (targetScale - liveScale) * scaleLerp;

    // draw video every frame regardless of model fps
    ctx.drawImage(video, 0, 0, W, H);

    // faint edge vignette, neutral
    const vg = ctx.createRadialGradient(W/2,H/2, H*0.3, W/2,H/2, H*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    stickers.forEach(s => {
      const age = clock - s.bornAt;
      const pop = easeOutBack(Math.min(1, age*3.2));
      drawFlower(s.x, s.y, s.size * Math.max(0, pop), s.rot + Math.sin(clock*0.6 + s.x)*0.05, s.hue, 0.96);
    });

    if(liveScale > 0.01){
      drawCluster(smoothX, smoothY, 58 * liveScale, clock*1.4, Math.min(1, liveScale*1.3));
    }

    requestAnimationFrame(render);
  }

  // ---------- Camera bootstrap ----------
  async function startExperience(){
    startOverlay.classList.add('hidden');
    loadingOverlay.classList.remove('hidden');

    try{
      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: W,
        height: H
      });
      await camera.start();
      loadingOverlay.classList.add('hidden');
      lastFrameTime = performance.now();
      requestAnimationFrame(render);
    }catch(err){
      loadingOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
      startOverlay.querySelector('h2').textContent = 'Camera unavailable';
      startOverlay.querySelector('p').textContent = 'Couldn\'t reach your camera. Check permissions, and make sure this page is served over https or localhost.';
      startBtn.textContent = 'Try again';
      console.error(err);
    }
  }

  startBtn.addEventListener('click', startExperience);
})();
</script>
</body>
</html>
